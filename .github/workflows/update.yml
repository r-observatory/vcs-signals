name: update
on:
  schedule:
    - cron: "30 6 * * *"
    # Catch-up. Does nothing unless the day's primary run failed to finish, so a
    # transient upstream outage costs a few hours rather than the whole day.
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: vcs-signals-update
  cancel-in-progress: false
env:
  TZ: UTC
jobs:
  # The workflow-level concurrency group means a catch-up run queues behind a
  # primary that is still going, so by the time this job runs the primary has
  # always concluded and its result can simply be read off.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Every trigger except the catch-up cron always runs.
          if [ "$SCHEDULE" != "30 11 * * *" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail OPEN. This runs only on the catch-up cron, which exists because
          # the day's data is already at risk, so an Actions API blip must not be
          # what throws the last attempt away. A redundant catch-up costs one run;
          # a skipped one costs the day.
          DONE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update.yml \
                   --status success --created "$(date -u +%Y-%m-%d)" --limit 50 \
                   --json databaseId \
                   --jq "[.[] | select(.databaseId != $SELF)] | length" 2>/dev/null) || DONE=""
          case "$DONE" in
            ''|*[!0-9]*)
              echo "Could not read today's run history; running the catch-up rather than risking the day."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ "$DONE" -gt 0 ]; then
            echo "Today's update already succeeded; nothing to catch up."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful update today; running the catch-up."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    # One lock for every job that seeds from release "current" and later
    # uploads whole tables back over it: this job, and the merge in weekly,
    # ai-weekly, ai-merge-rerun, backfill and ai-backfill. The workflow-level
    # group above stays as it is, because the guard relies on a catch-up
    # queueing behind the primary; it only ever kept this workflow from racing
    # itself. weekly and ai-weekly share a cron, and their merges overlapped on
    # 2026-08-30, 09-06 and 09-13. On the first two the AI merge seeded before
    # the weekly merge published and uploaded after it, silently putting the
    # weekly values in series_latest and the summary back to an earlier week.
    # This job seeds before a collection of about ninety minutes, the widest
    # window of any publisher, and a late cron or a dispatch can put that
    # window over a Sunday merge. A merge may now wait that long for it.
    #
    # The lock sits on the job, not the workflow, so the scans still run side
    # by side; a workflow-level group would run six-hour scans back to back.
    # queue: max because the default queue keeps one pending job and cancels
    # it when another arrives, discarding a publisher that was waiting its turn.
    # cancel-in-progress stays unset; true is refused alongside queue: max.
    # test-publish-lock.R fails any publishing job that lacks this block.
    concurrency:
      group: vcs-signals-publish
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RSQLite
            any::jsonlite
            any::testthat
      - name: Run tests
        run: Rscript tests/testthat.R
      - name: Ensure current release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view current --repo ${{ github.repository }} >/dev/null 2>&1 \
            || gh release create current --repo ${{ github.repository }} \
                 --title "vcs-signals (rolling)" \
                 --notes "Rolling data release, updated daily." --latest
      - name: Run update
        env:
          VCS_SIGNALS_TOKEN: ${{ secrets.VCS_SIGNALS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild }}
        run: Rscript scripts/update.R out/
      - name: Refresh release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f out/release_notes.md ]; then
            gh release edit current --repo ${{ github.repository }} --notes-file out/release_notes.md
          fi
      - name: Mirror year shards to per-year tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/mirror-year-tags.sh out

  keepalive:
    # GitHub disables a public repository's scheduled workflows after 60 days
    # without repository activity. Publishing a release does not count and a
    # commit does, so this commits a timestamp. It needs no other job, so an
    # update that fails or times out still keeps the schedule alive.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # The work takes seconds; the rest is headroom for a slow runner start.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update last run timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            # Decide against main as it is now, not the commit this run started
            # from, so a re-run, a queued run or a push that lands meanwhile
            # finds the newer commit and stops here instead of conflicting.
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            # A commit a day is far inside the 60-day window, so skip when main
            # already has a commit from the last 20 hours.
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 72000 ]; then
              echo "main already has a commit from the last 20 hours"
              exit 0
            fi
            echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
            git add last-updated.txt
            git commit -m "chore: update last run time"
            git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
